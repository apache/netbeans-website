github:
  description: "Apache NetBeans Website"
  homepage: "https://netbeans.apache.org/"
  labels:
    - netbeans
    - website
    - jbake
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
publish:
  whoami: asf-site
